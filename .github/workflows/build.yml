name: Build library

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.5.1'
      - name: Build
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            gradle build --no-daemon -Pversion="${GITHUB_REF_NAME#v}"
          else
            gradle build --no-daemon
          fi
      - uses: actions/upload-artifact@v6
        with:
          name: modulib-jars
          path: build/libs/*.jar
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: modulib-jars
          path: release-artifact
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" release-artifact/*.jar \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ModuLib ${GITHUB_REF_NAME#v}" \
            --generate-notes
